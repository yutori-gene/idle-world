name: Publish overview to gh-pages

on:
  push:
    branches: [main]
    paths: ['site/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gh-pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # site/ の中身をそのまま gh-pages ブランチの直下へ置き直す。
      # Pages の source を gh-pages に固定しておけば、リポジトリ設定を触らずに更新できる。
      - name: Publish site/ to gh-pages
        run: |
          set -eux
          staged=$(mktemp -d)
          cp -r site/. "$staged"/
          touch "$staged/.nojekyll"   # Jekyll を通さず静的ファイルをそのまま配信する

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan gh-pages
          git rm -rf --cached . > /dev/null
          find . -maxdepth 1 -mindepth 1 ! -name .git -exec rm -rf {} +
          cp -r "$staged"/. .

          git add -A
          git commit -m "site を公開（${GITHUB_SHA::7}）"
          git push -f origin gh-pages
