<style>
:root { color-scheme: light dark; --line: #8884; --head: #8882; }
/* main を縦横のスクロール枠にして、表見出しをその上端へ貼り付ける
   （ページ全体をスクロールさせると main が overflow の生成する scrollport になり
     sticky の基準が食い違うので、スクロールする側を main に一本化する） */
body { margin: 0; height: 100vh; display: flex; flex-direction: column;
  font: 13px/1.6 system-ui, sans-serif; }
header { flex: none; background: Canvas; border-bottom: 1px solid var(--line);
  padding: 8px 12px; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
h1 { font-size: 15px; margin: 0 8px 0 0; }
select, input { font: inherit; padding: 3px 6px; }
input[type=search] { min-width: 14em; }
button { font: inherit; padding: 3px 10px; cursor: pointer; }
button[aria-pressed=true] { font-weight: 700; outline: 2px solid currentColor; }
#count { margin-left: auto; opacity: .7; }
main { flex: 1; overflow: auto; padding: 0 12px 40px; }
table { border-collapse: collapse; width: 100%; }
th, td { border-bottom: 1px solid var(--line); padding: 3px 6px; text-align: left;
  vertical-align: top; white-space: nowrap; }
th { position: sticky; top: 0; z-index: 1; background: Canvas;
  box-shadow: 0 1px 0 var(--line); cursor: pointer; user-select: none; }
td.wrap { white-space: normal; min-width: 18em; }
tbody tr:hover { background: var(--head); }
.num { text-align: right; }
</style>

function fillSelect(el, values, label) {
  const current = el.value;
  el.innerHTML = `<option value="">${label}（すべて）</option>` +
    values.map(v => `<option>${v}</option>`).join("");
  if (values.includes(current)) el.value = current;
}

function refresh() {
  const rows = DATA[mode];
  fillSelect(category, [...new Set(rows.map(r => r.category))].sort(byOrder), "カテゴリ");

  const columns = COLUMNS[mode];
